name: Build with MSBuild

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build solution with MSBuild
        run: msbuild HelloWorld.sln /t:Restore,Build /p:Configuration=Release

      - name: Publish single-file EXE
        run: >
          dotnet publish .\HelloWorld\HelloWorld.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o .\artifacts\publish

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-win-x64
          path: .\artifacts\publish\*
          if-no-files-found: error
